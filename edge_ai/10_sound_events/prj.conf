#
# 10_sound_events — cinco detectores de som do Edge AI Lab na NPU Axon
# (curso nrf-manaus-2). Configs de engine iguais as do 07_ww_kws; o
# interlayer buffer e COMPARTILHADO pelos cinco modelos, e todos declaram
# a mesma necessidade (6048 B, conferida em tempo de compilacao pelo
# static_assert de cada nrf_edgeai_user_model_axon.h).
#

# nRF Edge AI + Axon
CONFIG_NRF_EDGEAI=y
CONFIG_NRF_AXON=y
CONFIG_FPU=y
CONFIG_NRF_AXON_INTERLAYER_BUFFER_SIZE=6048
CONFIG_NRF_AXON_PSUM_BUFFER_SIZE=0

# Audio PDM
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# Console e logging
CONFIG_LOG=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_ASSERT=y
