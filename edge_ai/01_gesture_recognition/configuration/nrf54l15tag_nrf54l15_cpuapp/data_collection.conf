#
# Fragmento do curso (nao existe no Edge AI Add-on) — modo de coleta de dados.
#
# Uso:
#   west build ... -d <build dir proprio> -- -DEXTRA_CONF_FILE=data_collection.conf
# ou, no VS Code (extensao nRF Connect), campo "Kconfig fragments": data_collection.conf
#
# Use um build dir DIFERENTE do build normal do 01 (ex.: build_tag_collect). Assim o
# demo de gestos e o modo de coleta convivem sem recompilar um por cima do outro.
#
# O prj.conf nao muda: continua byte a byte igual ao do SDK. Sem este fragmento o build
# e o demo HID de sempre.
#
# O que o modo de coleta faz (src/main.c):
#   - NAO roda inferencia — o main pula nrf_edgeai_run_inference()
#   - manda cada amostra do IMU por BLE NUS via ble_nus_send(), no formato
#       "<id> ax,ay,az,gx,gy,gz\r\n"
#     com int16 em mili-unidades (sensor_value_to_double() * 1000), 100 Hz,
#     fundo de escala +-4 g / +-1000 dps
#   - quem recebe e o lab 03_central_uart, que faz a ponte NUS -> UART/USB-serial
#
# Como descobrir o endereco BLE do seu tag (necessario para configurar o central):
#   ligue o RTT e leia a linha "Identity:" no boot — ela vem do bt_dev_show_info()
#   do proprio Zephyr (subsys/bluetooth/host/hci_core.c), sem codigo nosso.
#

CONFIG_DATA_COLLECTION_MODE=y
# Redundante (o Kconfig ja faz "default BLE_MODE_NUS if DATA_COLLECTION_MODE"),
# explicito para o aluno ver por onde o dado sai.
CONFIG_BLE_MODE_NUS=y

#
# Buffers de log: os dois vem em 1024 bytes e a rajada de boot (stack BT + linhas do
# app) estoura os dois, derrubando EM SILENCIO justamente a linha "Identity:" com o
# endereco do tag. Verificado no hardware: o log corta no meio de
# "<inf> bt_hci_core: HW Platform: Nordi", que e logo antes do Identity.
#
# Nao adianta mexer so no buffer do RTT: no modo deferred (ja ativo) a mensagem morre
# antes, no ring buffer do proprio subsistema de log. Sao dois buffers.
#
# Mesma correcao usada em C:\work\nrf-tag (tag/01-motion-adv/prj.conf e os demais).
#
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
