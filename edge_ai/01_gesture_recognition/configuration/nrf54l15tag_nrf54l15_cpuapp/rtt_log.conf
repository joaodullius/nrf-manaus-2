#
# Fragmento do curso (nao existe no Edge AI Add-on) — console e shell por RTT.
#
# Uso:
#   west build ... -- -DEXTRA_CONF_FILE=rtt_log.conf
# ou, no VS Code (extensao nRF Connect), campo "Kconfig fragments": rtt_log.conf
#
# Caminho relativo funciona porque o CMakeLists.txt aponta APPLICATION_CONFIG_DIR para
# configuration/<board>, e o Zephyr resolve EXTRA_CONF_FILE relativo contra esse diretorio
# (zephyr/cmake/modules/kconfig.cmake). Sem o fragmento, o build e o do SDK, sem alteracao.
#
# Por que existe: a nRF54L15 TAG nao tem UART de console — o DTS nao declara zephyr,console
# nem zephyr,shell-uart e nao ha USB-serial na placa. Todo texto sai pelo RTT, lido pelo
# debugger J-Link do DK em que a TAG esta encaixada.
#
# O prj.conf do upstream ja liga CONFIG_USE_SEGGER_RTT + CONFIG_LOG, entao os LOG_INF()
# ja saem por RTT sem este fragmento. O que ele acrescenta, no mesmo canal (buffer RTT 0):
#   - console: printk() — banner de boot, CSV do modo de coleta, passkey do pareamento
#   - shell:   terminal interativo (kernel version, kernel uptime, device list, ...)
#
# Efeito colateral desejado: com CONFIG_SHELL=y o Zephyr ativa CONFIG_SHELL_LOG_BACKEND=y e
# o CONFIG_LOG_BACKEND_RTT cai para n sozinho (default y if !SHELL_LOG_BACKEND). O log passa
# a sair pelo shell e nao ha dois escritores disputando o buffer RTT 0.
#
# Custo medido: +35 kB de FLASH e +5 kB de RAM sobre o build sem o fragmento.
#

CONFIG_RTT_CONSOLE=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_RTT=y
# Explicito: nao ha UART de console no DTS desta placa.
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_PROMPT_RTT="tag:~$ "
