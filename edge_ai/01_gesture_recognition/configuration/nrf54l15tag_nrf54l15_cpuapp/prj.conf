# nRF Edge AI
CONFIG_NRF_EDGEAI=y
# nRF Edge AI dependencies
CONFIG_FPU=y

# Enable sensor, button and LED libraries
CONFIG_SPI=y
CONFIG_SENSOR=y
CONFIG_GPIO=y

# Enable logging and assert
CONFIG_LOG=y
CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_ASSERT=y

# Bluetooth configuration
CONFIG_BT=y
CONFIG_BT_MAX_CONN=2
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
# Require MITM-protected pairing (Numeric Comparison, security level 4).
CONFIG_BLE_MITM_AUTH=y
CONFIG_BT_L2CAP_TX_BUF_COUNT=5
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="nRF Edge AI Remote Control"
CONFIG_BT_DEVICE_APPEARANCE=961

CONFIG_BT_GATT_UUID16_POOL_SIZE=40
CONFIG_BT_GATT_CHRC_POOL_SIZE=20

CONFIG_BT_CONN_CTX=y

CONFIG_BT_DIS_MANUF_NAME=y
CONFIG_BT_DIS_MANUF_NAME_STR="NordicSemiconductor"
CONFIG_BT_DIS_PNP_VID_SRC=2
CONFIG_BT_DIS_PNP_VID=0x1915
CONFIG_BT_DIS_PNP_PID=0xEEEF
CONFIG_BT_DIS_PNP_VER=0x0100

CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

# Enable MCUmgr, MCUmgr handlers, and dependencies
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_MCUMGR=y

CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y

CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y

# Enable the Bluetooth MCUmgr transport (authenticated - requires bonding with MITM)
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW_AUTHEN=y

#
# --- Console e shell por RTT (adicionado pelo curso, nao esta no Add-on) ---
#
# A nRF54L15 TAG nao tem UART de console: o DTS nao declara zephyr,console nem
# zephyr,shell-uart e nao ha USB-serial na placa. Todo texto sai pelo RTT, lido pelo
# J-Link do DK em que a TAG esta encaixada (DEBUG OUT).
#
# O upstream ja liga CONFIG_USE_SEGGER_RTT + CONFIG_LOG, entao os LOG_INF() ja saiam
# por RTT. O que se acrescenta, no mesmo canal (buffer RTT 0):
#   - console: printk() — banner de boot, CSV do modo de coleta, passkey do pareamento
#   - shell:   terminal interativo (kernel version, kernel uptime, device list, ...)
#
# Com CONFIG_SHELL=y o Zephyr ativa CONFIG_SHELL_LOG_BACKEND=y e o CONFIG_LOG_BACKEND_RTT
# cai para n sozinho: o log passa a sair pelo shell e nao ha dois escritores disputando
# o buffer RTT 0. Custo medido: +35 kB de FLASH e +5 kB de RAM.
#
CONFIG_RTT_CONSOLE=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_RTT=y
# Explicito: nao ha UART de console no DTS desta placa.
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_PROMPT_RTT="tag:~$ "

#
# --- Buffers de log (adicionado pelo curso) ---
#
# Os dois vem em 1024 bytes e a rajada de boot (stack BT + linhas do app) estoura
# ambos. Sem isto, tudo que o main() loga no inicio some EM SILENCIO — inclusive a
# linha "Identity:" com o endereco BLE do tag e a linha
#
#   <inf> main: nRF Edge AI Lab Solution id: 95867
#
# que e a unica verificacao de "gravei o modelo certo?" sem abrir arquivo. Verificado
# no hardware em 2026-09-01: com os defaults o log corta no meio do bt_hci_core.
#
# Nao adianta mexer so no buffer do RTT: no modo deferred a mensagem morre antes, no
# ring buffer do proprio subsistema de log. Sao dois buffers.
#
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
