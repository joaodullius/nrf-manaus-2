#
# Fragmento do curso — ponte BINARIA, para receber o 04_data_forwarder.
#
# Uso:
#   west build ... -- -DEXTRA_CONF_FILE="meu_tag.conf;binary_bridge.conf"
#
# Sem este fragmento o 03 e uma ponte de TEXTO, para o CSV do
# 01_gesture_recognition em modo de coleta. Sao dois transportes diferentes:
#
#   texto    "<id> ax,ay,az,gx,gy,gz\r\n"     <- 01_gesture_recognition
#   binario  CBOR dentro de COBS + CRC-16     <- 04_data_forwarder
#
# 1. Repassa os bytes intactos (ver src/main.c, ble_data_received).
CONFIG_LAB_BRIDGE_BINARY=y
#
# 2. MTU. O tag do 04_data_forwarder negocia 247; sem isto o central oferece o
#    default (23) e cada notificacao carrega 20 bytes uteis. Com 6 canais int32
#    a 100 Hz isso e fragmentacao demais. Os mesmos valores que o
#    data_forwarder usa do lado do tag, e que a doc do add-on manda usar na
#    ponte (tools/data_forwarder_host/docs/ble_throughput_tuning.md).
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
