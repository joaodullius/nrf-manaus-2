# Enable the UART driver
CONFIG_UART_ASYNC_API=y
CONFIG_NRFX_UARTE=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Enable the BLE stack with GATT Client configuration
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_SMP=y
CONFIG_BT_GATT_CLIENT=y

# Enable the BLE modules from NCS
CONFIG_BT_NUS_CLIENT=y
CONFIG_BT_SCAN=y
CONFIG_BT_SCAN_FILTER_ENABLE=y
CONFIG_BT_SCAN_UUID_CNT=1
CONFIG_BT_SCAN_ADDRESS_CNT=1
CONFIG_BT_GATT_DM=y
CONFIG_HEAP_MEM_POOL_SIZE=2048

# This example requires more stack
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
# Enable bonding
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

# Config logger
CONFIG_LOG=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_PRINTK=n

CONFIG_ASSERT=y

#
# --- Buffers de log (adicionado pelo curso, nao esta no sample) ---
#
# Os dois vem em 1024 bytes e a rajada de boot estoura ambos: verificado no hardware,
# o log do central cortava em "<inf> bt_hci_core: HCI transport: SDC" e sumiam as
# linhas seguintes — inclusive o "Filtrando pelo tag ..." que confirma em qual tag
# este central vai conectar. Justamente o que o aluno precisa ver.
#
# Nao adianta mexer so no buffer do RTT: no modo deferred a mensagem morre antes,
# no ring buffer do proprio subsistema de log. Sao dois buffers.
#
# Mesma correcao aplicada no lado do tag (prj.conf do 01) e em
# C:\work\nrf-tag (tag/01-motion-adv/prj.conf).
#
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
