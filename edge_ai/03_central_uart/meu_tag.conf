#
# Fragmento do aluno — endereco BLE do SEU tag.
#
# Uso:
#   west build ... -- -DEXTRA_CONF_FILE=meu_tag.conf
#
# Como descobrir o endereco: compile o 01_gesture_recognition com o fragmento
# data_collection.conf, grave no tag, abra o RTT e leia a linha "Identity:"
# impressa no boot, por exemplo:
#
#   <inf> bt_hci_core: Identity: EC:EF:40:2D:5E:46 (random)
#                                ^^^^^^^^^^^^^^^^^  ^^^^^^
#                                VALUE              TYPE
#
# Deixar vazio faz o build falhar de proposito: um central sem endereco
# conectaria no tag do colega.
#
CONFIG_LAB_TAG_ADDR_VALUE=""
CONFIG_LAB_TAG_ADDR_TYPE="random"
