#
# 08_cough_detection — detector de tosse do Edge AI Lab na NPU Axon
# (curso nrf-manaus-2). A parte de engine vem do prj_example.conf que o Lab
# poe dentro do zip (src/nrf_edgeai_generated/prj_example.conf); o resto e
# audio PDM e console.
#

# nRF Edge AI + Axon (do prj_example.conf do zip)
CONFIG_NRF_EDGEAI=y
CONFIG_NEWLIB_LIBC=y
CONFIG_FPU=y
CONFIG_NRF_AXON=y
CONFIG_NRF_AXON_INTERLAYER_BUFFER_SIZE=6048
CONFIG_NRF_AXON_PSUM_BUFFER_SIZE=0

# Audio PDM
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# Console e logging
CONFIG_LOG=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_ASSERT=y
