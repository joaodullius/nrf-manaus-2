#
# 04_classify_led — app minima do curso: IMU -> inferencia -> LED RGB.
# Base: samples/nrf_edgeai/classification do Edge AI Add-on v2.3.0.
#

# Edge AI
CONFIG_NRF_EDGEAI=y
CONFIG_FPU=y
CONFIG_NCS_SAMPLES_DEFAULTS=y

# Sensor: BMI270 da TAG (no barramento SPI)
CONFIG_SENSOR=y
CONFIG_BMI270=y
CONFIG_SPI=y

# LED RGB
CONFIG_GPIO=y

# Log por RTT — a TAG nao tem UART de console.
CONFIG_LOG=y
# CONFIG_NCS_SAMPLES_DEFAULTS puxa CONFIG_LOG_MODE_MINIMAL=y. Em modo minimo o
# log NAO tem backends: ele vai para o console — e a TAG nao tem console. O
# resultado e silencio absoluto no RTT, com o firmware rodando normalmente.
# Verificado no hardware: sem esta linha, nem o banner de boot aparece.
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
# Os dois vem em 1024 e a rajada de boot estoura ambos, engolindo linhas.
# Mesma correcao do 01 (data_collection.conf) e do 03.
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

CONFIG_ASSERT=y
