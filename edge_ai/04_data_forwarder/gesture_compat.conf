#
# Fragmento do curso — alinha o data_forwarder com o 01_gesture_recognition.
#
# Uso:
#   west build ... -- -DEXTRA_CONF_FILE=gesture_compat.conf
#
# Sem este fragmento o sample manda 9 canais (BMI270 + BME688). O modelo de
# gesto usa 6. Voltar para 6 tambem reduz a banda pela metade, o que importa
# na ponte BLE.
CONFIG_DATA_FWD_EXTRA_SENSOR_BME688=n

# O que NAO da para alinhar por Kconfig, e precisa ficar claro:
#
#   fundo de escala   o sample crava +-2 g / +-500 dps em src/sensor/bmi270.c
#                     (linhas 85 e 102, literais). O 01_gesture_recognition usa
#                     +-4 g / +-1000 dps (main.c:322). A +-2 g um gesto vigoroso
#                     satura. Para alinhar e preciso editar o bmi270.c.
#
#   unidades          com INT32_VALUES=y (default do sample) os valores saem em
#                     MICRO-unidades; o 01 alimenta a inferencia em MILI. Fator
#                     1000. No loop 2 isso nao e problema, porque a app de
#                     inferencia e escrita para casar com o que foi capturado.
