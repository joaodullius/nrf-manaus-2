#
# Fragmento do aluno — a rede Wi-Fi da sala.
#
# Uso:
#   west build ... -- -DEXTRA_CONF_FILE=minha_rede.conf
#
# Deixar vazio faz o build falhar de proposito: um kit sem credencial nao
# conecta em lugar nenhum, e o erro em tempo de build e mais barato que
# descobrir isso com o log rodando.
#
# NUNCA commite a senha real. Antes de commitar:
#   git checkout comms/07_wifi_sta/minha_rede.conf
#
CONFIG_WIFI_CREDENTIALS_STATIC_SSID=""
CONFIG_WIFI_CREDENTIALS_STATIC_PASSWORD=""
