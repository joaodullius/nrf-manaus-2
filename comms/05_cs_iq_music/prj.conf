CONFIG_NCS_SAMPLES_DEFAULTS=y
CONFIG_DK_LIBRARY=y

CONFIG_BT=y
CONFIG_BT_SMP=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_BONDABLE=n

CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_DYNAMIC_DB=y

CONFIG_BT_CHANNEL_SOUNDING=y
CONFIG_BT_RAS=y
CONFIG_BT_RAS_RREQ=y

CONFIG_BT_SCAN=y
CONFIG_BT_SCAN_FILTER_ENABLE=y
CONFIG_BT_SCAN_UUID_CNT=1
# ALTERADO PELO CURSO (nrf-manaus-2): um slot de filtro por endereco, para o
# add_tag_address_filter() de src/main.c.
CONFIG_BT_SCAN_ADDRESS_CNT=1

# The Ranging Profile recommends a MTU of at least 247 octets.
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_ATT_PREPARE_COUNT=3
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# This reduces RAM usage. Additional RAM is needed to support optional
# features such as mode 3 or multiantenna. Change or remove these if
# using those features
CONFIG_BT_RAS_MODE_3_SUPPORTED=n
# ALTERADO PELO CURSO (nrf-manaus-2): ate 2 caminhos de antena (o sample usa 1).
# A LM20-DK tem UMA antena (NUM_ANTENNAS fica 1); o TAG tem duas, e o par
# 1 x 2 da dois caminhos. Quantos usar e CONFIG_LAB_ANTENNA_PATHS (Kconfig).
CONFIG_BT_RAS_MAX_ANTENNA_PATHS=2
CONFIG_BT_CS_DE_MAX_NUM_ANTENNA_PATHS=2
CONFIG_BT_CTLR_SDC_CS_MAX_ANTENNA_PATHS=2
CONFIG_BT_CTLR_SDC_CS_NUM_ANTENNAS=1
CONFIG_BT_CTLR_SDC_CS_STEP_MODE3=n
CONFIG_BT_CTLR_SDC_CS_ROLE_INITIATOR_ONLY=y

# Disabling the CS Test command reduces flash usage
CONFIG_BT_CTLR_CHANNEL_SOUNDING_TEST=n

# This allows CS and ACL to use different PHYs
CONFIG_BT_TRANSMIT_POWER_CONTROL=y

# This improves the performance of floating-point operations
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

CONFIG_CBPRINTF_FP_SUPPORT=y

CONFIG_BT_CS_DE=y
CONFIG_BT_CS_DE_512_NFFT=y

#
# --- Log por RTT, serial so para o CSV (adicionado pelo curso, nao esta no sample) ---
#
# O despejo de IQ sai por printk na UART console (uart20 da DK). Se o log do
# sample fosse para a mesma UART, as linhas se intercalariam no meio do CSV.
# Mesma solucao do edge_ai/03_central_uart: log no RTT, printk fora do log.
# O sample vem em LOG_MODE_MINIMAL (via NCS_SAMPLES_DEFAULTS), em que o log sai
# por printk no console; CONFIG_LOG_MODE_DEFERRED=y liga o logger completo para
# o backend RTT existir.
#
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_PRINTK=n
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

#
# --- Largura de banda da serial (adicionado pelo curso, nao esta no sample) ---
#
# Cada procedure emite 75 linhas IQ + 1 linha CS, cerca de 2,7 kB no total. A
# serial USB roda em 115200 8N1, cerca de 11,5 kB/s uteis: teto de ~4
# procedures/s. O default do sample pede 5 procedures/s (RAS_FEAT_REALTIME_RD),
# acima desse teto. Por isso o despejo roda com CONFIG_LAB_PROCEDURE_INTERVAL=50
# (1 procedure/s), com 4x de folga sobre o teto da serial.
#
CONFIG_LAB_PROCEDURE_INTERVAL=50
