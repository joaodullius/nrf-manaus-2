#
# Fragmento da DEMONSTRACAO ao vivo (cs_dash.py) — nao e o default do lab.
#
# Uso:
#   west build ... -- -DEXTRA_CONF_FILE=demo.conf
#
# O lab captura a 1 procedure/s (LAB_PROCEDURE_INTERVAL=50) porque 30 s de
# captura ja dao estatistica de sobra e o arquivo fica pequeno. Numa demo em
# que o instrutor anda com o TAG, 1/s e lento demais para a plateia ver a
# mudanca; aqui vamos a ~2/s.
#
# 2/s e o teto real: com 2 caminhos de antena sao ~5,4 kB por procedure, e
# 115200 8N1 entrega ~11,5 kB/s. Pedir mais so faz o firmware descartar.
#
CONFIG_LAB_PROCEDURE_INTERVAL=25
