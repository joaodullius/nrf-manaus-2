#
# Codigo do curso (nrf-manaus-2).
#
# Base: blocos de CONFIG_WIFI*/CONFIG_NET*/DHCP de nrf/samples/wifi/sta
# (nRF Connect SDK v3.4.0), sem as credenciais de exemplo -- a rede e o
# servidor sao digitados no terminal no boot (src/lab_rede.c, como nos labs 7 e 9).
#
CONFIG_WIFI=y
CONFIG_WIFI_NRF70=y

# WPA supplicant
CONFIG_WIFI_NM_WPA_SUPPLICANT=y
CONFIG_WIFI_READY_LIB=y
CONFIG_NRF_WIFI_RPU_RECOVERY=y

# ALTERADO PELO CURSO (nrf-manaus-2): sem credencial no binario. SSID e senha
# sao digitados no terminal no primeiro boot e gravados em settings (ZMS na
# storage_partition) pela biblioteca wifi_credentials. Ver src/lab_rede.c.
CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CREDENTIALS_MAX_ENTRIES=1
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS_ZMS=y

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_LOG=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_DHCPV4=y

CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NRF70_RX_NUM_BUFS=16

# Below section is the primary contributor to SRAM and is currently
# tuned for performance, but this will be revisited in the future.
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_HEAP_MEM_POOL_SIZE=37000
CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y
CONFIG_NRF_WIFI_CTRL_HEAP_SIZE=20000
CONFIG_NRF_WIFI_DATA_HEAP_SIZE=40000
CONFIG_NET_TC_TX_COUNT=1

CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=1
CONFIG_NET_MAX_CONTEXTS=5
CONFIG_NET_CONTEXT_SYNC_RECV=y

CONFIG_INIT_STACKS=y

CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_ETHERNET_MGMT=y

CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_INIT_TIMEOUT=0

CONFIG_ZVFS_POLL_MAX=10

# Memories
#
# CONFIG_MAIN_STACK_SIZE=5200, nao o padrao (4096): mesmo achado do lab 9 --
# o caminho do wpa_supplicant, logo depois da espera por
# CONFIG_WIFI_READY_LIB, e fundo o bastante para estourar uma pilha de 4096.
# E o mesmo valor que o sample wifi/sta ja usa, e pelo mesmo motivo.
CONFIG_MAIN_STACK_SIZE=5200
CONFIG_NET_TX_STACK_SIZE=4096
CONFIG_NET_RX_STACK_SIZE=4096

# Debugging
CONFIG_STACK_SENTINEL=y
CONFIG_DEBUG_COREDUMP=y
CONFIG_DEBUG_COREDUMP_BACKEND_LOGGING=y
CONFIG_DEBUG_COREDUMP_MEMORY_DUMP_MIN=y
CONFIG_SHELL_CMDS_RESIZE=n

# Kernel options
CONFIG_ENTROPY_GENERATOR=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_POSIX_TIMERS=y

CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.1.99"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.1.1"

# printing of scan results puts pressure on queues in new locking
# design in net_mgmt. So, use a higher timeout for a crowded
# environment.
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000

# Codigo do curso (nrf-manaus-2)
CONFIG_GPIO=y
# CONFIG_MAIN_STACK_SIZE fica na secao "Memories" acima, com 5200 -- mesma
# licao do lab 9, nao um valor arbitrario.
#
# Este lab nao le sensor (CONFIG_SENSOR/CONFIG_TEMP_NRF5, do lab 9, nao
# entram aqui) nem manda ponto flutuante pela rede -- so inteiros no formato
# "AP,<bssid>,<rssi>,<frequencia>,<ssid>" (ver src/main.c).
