# Overwriting antenna settings to use the additional antennas on the tag
CONFIG_BT_CS_DE_MAX_NUM_ANTENNA_PATHS=4
CONFIG_BT_CTLR_SDC_CS_MAX_ANTENNA_PATHS=4
CONFIG_BT_CTLR_SDC_CS_NUM_ANTENNAS=2

# ALTERADO PELO CURSO (nrf-manaus-2): bloco abaixo acrescentado.
#
# O nRF54L15-TAG nao tem UART: nenhum "chosen" do board declara zephyr,console
# nem zephyr,shell-uart, e "uart" nao esta na lista supported do
# nrf54l15tag_nrf54l15_cpuapp.yaml. O sample liga CONFIG_NCS_SAMPLES_DEFAULTS=y,
# que implica LOG_DEFAULT_MINIMAL — o log e via printk (modo minimal, linhas no
# formato "I: mensagem"), nao pelos backends de log completos (LOG_BACKEND_RTT
# nem chega a existir em modo minimal). Em modo minimal, printk sai pelo
# console: sem este bloco nao ha console nenhum configurado, o reflector
# compila limpo e nao imprime NADA em lugar nenhum.
#
# RTT so existe com o TAG encaixado no DEBUG OUT da DK. Na bateria nao ha log:
# a evidencia de vida e o LED e a saida do initiator.
#
CONFIG_USE_SEGGER_RTT=y
CONFIG_CONSOLE=y
CONFIG_RTT_CONSOLE=y

# O buffer de up vem em 1024 e a rajada de boot estoura — a linha "Identity:"
# e as de "CS ... enabled" somem.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
