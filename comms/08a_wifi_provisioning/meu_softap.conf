#
# Fragmento do aluno — o SSID do SoftAP de provisionamento deste kit.
#
# Uso:
#   west build ... -- -D08a_wifi_provisioning_EXTRA_CONF_FILE=meu_softap.conf
#
# Vem com o valor padrao da biblioteca, que e o que o app da Nordic ja sugere.
# Numa sala com varios kits, todos anunciam ESTE MESMO nome e nao ha como saber em
# qual deles voce entrou — o SoftAP e aberto, e o SSID e a unica coisa que distingue
# um kit do outro no ar. Se quiser o seu proprio, troque o valor abaixo por algo
# unico (numero de bancada, iniciais).
#
# ATENCAO ao escolher o nome, se voce for usar o APP nRF Wi-Fi Provisioner:
# o campo "Edit SSID" do app tem um defeito — a tela se redesenha sozinha e o
# teclado volta para as letras toda vez que voce troca para a pagina de simbolos,
# o que torna impossivel digitar "-" ou qualquer caractere especial. Entao:
#   - use SO letras e numeros (ex.: "nrfprov07"), e o app consegue digitar; ou
#   - use o scripts/provision.py, que NAO olha o SSID do SoftAP — voce entra na
#     rede na mao e ele fala com wifiprov.local. Por script, qualquer nome serve.
# Observado na bancada em 2026-09-07.
#
# Diferente do minha_rede.conf dos labs 7, 9, 11, 12 e 13, este valor NAO e
# segredo: pode ser commitado a vontade.
#
# Nao mexa no CONFIG_NET_HOSTNAME por causa disto. O certificado do servidor HTTPS
# e amarrado ao hostname (wifiprov.local), nao ao SSID, e o provision.py resolve
# esse nome. Mudar so o SSID nao obriga a regerar certificado nenhum.
#
CONFIG_SOFTAP_WIFI_PROVISION_SSID="nrf-wifiprov"
