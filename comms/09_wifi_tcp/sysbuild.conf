#
# Codigo do curso (nrf-manaus-2).
#
# Sem este arquivo o build fecha limpo e o firmware nao tem Wi-Fi: o driver do
# nRF7002 nunca e habilitado, e o log de boot diz "Nenhuma interface Wi-Fi
# encontrada". Os labs 6, 7 e 8 herdaram este arquivo dos samples do SDK; este
# lab e codigo do curso e precisa traze-lo de proposito.
#
SB_CONFIG_WIFI_NRF70=y
SB_CONFIG_PARTITION_MANAGER=n

# Gera merged_<board>.hex no build dir (o hex que vai para a pasta hex/ do curso)
SB_CONFIG_MERGED_HEX_FILES=y
