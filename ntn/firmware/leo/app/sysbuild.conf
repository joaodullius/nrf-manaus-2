# NCS v3.4.0 makes SB_CONFIG_PARTITION_MANAGER default to n, which switches sysbuild
# to the DTS-based partition scheme and requires s0_partition/s1_partition devicetree
# labels. This branch still describes its partitions through the Partition Manager
# (nordic,pm-ext-flash, CONFIG_PM_PARTITION_SIZE_MCUBOOT), so keep it enabled.
SB_CONFIG_PARTITION_MANAGER=y
