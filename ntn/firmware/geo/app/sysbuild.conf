# NCS v3.4.0 marks SB_CONFIG_PARTITION_MANAGER as deprecated and gives it no
# default, so it resolves to n and sysbuild then expects the s0_partition and
# s1_partition DTS labels that this branch does not define. Keep the Partition
# Manager until this branch is migrated to the DTS partition scheme.
SB_CONFIG_PARTITION_MANAGER=y
