# PDN configuration for eminify SIM card
CONFIG_LTE_LC_PDN_DEFAULTS_OVERRIDE=y
CONFIG_LTE_LC_PDN_DEFAULT_FAM_IPV4=y
CONFIG_LTE_LC_PDN_DEFAULT_APN="em"

# Skylo runs on band 255, not the 256 the base configuration assumes. This is
# also the band the AT-command bring-up left as a permanent %XBANDLOCK on the
# test kit, and runtime and permanent masks are ANDed: any other band here
# would make the lock command fail before the attach even starts.
CONFIG_APP_NTN_BANDLOCK_ENABLE=y
CONFIG_APP_NTN_BANDLOCK=255
