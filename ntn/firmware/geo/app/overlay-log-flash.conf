# Mirror the application log to the external flash.
#
# Zephyr's file-system log backend writes every log line it would send to the
# console into a ring of files under CONFIG_LOG_BACKEND_FS_DIR as well. The
# console backend stays active, so nothing changes on the serial port; the
# flash copy is there for the runs nobody was watching. The backend expects
# the directory to be a mounted volume, which src/log_flash.c takes care of
# at boot (built whenever CONFIG_LOG_BACKEND_FS is set).
#
# The copy is off by default, to spare the flash, and is switched on from the
# shell; the switch is a marker file on the volume, so it survives reboots
# and reflashes.
#
# Add with: -DEXTRA_CONF_FILE=overlay-log-flash.conf
#
# Switch:                 log_flash on   /   log_flash off   /   log_flash status
# Read back on the kit:   fs ls /lfs1   /   fs cat /lfs1/log.0000
# Wipe:                   fs rm /lfs1/log.0000 (per file)
# From the host:          scripts/log_flash_pull.py --port COMx
# Details:                docs/common/flash_log.md
#
# Changing the partition size reformats the volume on the next boot; the
# files are lost. A reflash of the application does not touch them.

# LittleFS on a Partition Manager partition in the external flash. Enabling
# LittleFS is what makes the Partition Manager define littlefs_storage; the
# region and size options place it and size it.
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_PM_PARTITION_REGION_LITTLEFS_EXTERNAL=y
CONFIG_PM_PARTITION_SIZE_LITTLEFS=0x1000000

# LittleFS uses the flash erase page as its block. The SPI NOR driver reports
# 64 KiB pages by default, which would waste most of the partition on files
# far smaller than that; the part erases 4 KiB sectors just fine.
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

# Files of 64 KiB, 200 of them, oldest dropped when the ring is full: about
# 12 MiB of history. At debug level with the GNSS searching that is close to
# 1 KiB/s, so a few hours; at INF it is weeks. A new boot keeps appending to
# the newest file, so one file can span two sessions; the timestamp
# restarting from zero marks the boundary.
CONFIG_LOG_BACKEND_FS=y
CONFIG_LOG_BACKEND_FS_DIR="/lfs1"
CONFIG_LOG_BACKEND_FS_FILE_SIZE=65536
CONFIG_LOG_BACKEND_FS_FILES_LIMIT=200
CONFIG_LOG_BACKEND_FS_OVERWRITE=y

# Not started by the logging core: log_flash.c enables the backend itself,
# at boot when the marker file is there or on "log_flash on", and at the
# maximum level, so the flash mirrors the console. (An autostarted backend
# would come up at the runtime default, INF, and miss the debug lines.)
CONFIG_LOG_BACKEND_FS_AUTOSTART=n

# The backend writes from the log processing thread, which now runs LittleFS
# and the SPI driver on top of the formatting it already did. Flash writes are
# also slower than the UART, so give the buffer more room to absorb bursts.
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=4096
CONFIG_LOG_BUFFER_SIZE=8192
