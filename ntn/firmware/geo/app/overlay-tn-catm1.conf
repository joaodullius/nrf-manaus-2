# TN validation build for the button-driven application.
#
# Same state machine, socket, payload and send acknowledgement path as the NTN
# field build, attached over Cat-M1 with an ordinary SIM so that everything but
# the satellite link can be exercised indoors. The difference is confined to
# the modem steps that only exist on the NTN modem firmware, gated in ntn.c by
# APP_NTN_LINK_TN.
#
#   Push-Location C:/ncs/v3.4.0
#   C:/ncs/tools/nrfutil.exe toolchain-manager launch --ncs-version v3.4.0 -- `
#     west build --build-dir C:/work/bgeo C:/work/geo/app `
#       --pristine --board nrf9151dk/nrf9151/ns -- `
#       "-DEXTRA_CONF_FILE=overlay-tn-catm1.conf"
#   Pop-Location

CONFIG_APP_NTN_LINK_TN=y

# The kit carries mfw_nrf9151-ntn. Only set APP_NTN_MODEM_FW_TN on a kit with
# the terrestrial modem firmware; it skips every NTN-firmware step, which is
# exactly what this build is meant to exercise.

# The NTN band lock has no meaning on a terrestrial cell.
CONFIG_APP_NTN_BANDLOCK_ENABLE=n

# The buttons are physical and the LEDs are visual. These two make the
# application drivable and observable by an automated run, and they belong only
# in this build.
CONFIG_APP_NTN_BUTTON_INJECT_SHELL=y
CONFIG_APP_NTN_STATUS_LEDS_TRACE=y

# Debug level, so the GNSS fix reports the satellites it sees. Verbose, but
# being able to watch a fix come together is worth more than a tidy log while
# this is being brought up.
CONFIG_APP_NTN_LOG_LEVEL_DBG=y

# Ten minutes to find a fix rather than three. On the bench the kit sits under
# a roof, so cold starts under a poor sky are the norm.
CONFIG_APP_NTN_GNSS_FIX_RETRY_SECONDS=600
